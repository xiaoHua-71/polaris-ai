server:
  port: 8103
  servlet:
    context-path: /api

spring:
  application:
    name: polaris-ai
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7

logging:
  level:
    com.xiaohua.polaris: debug
